<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cpsumotorpooladmin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CPSU MotorPool - Admin</title>
  <link rel="manifest" href="manifest.json">
  
  <style>
    :root {
      color-scheme: dark;
      --brand-green: #1F8A3D;
      --brand-deep: #0F3D24;
      --brand-light: #4ADE80;
      --text-muted: rgba(255, 255, 255, 0.68);
    }

    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #0F3D24 0%, #176E30 35%, #1F8A3D 70%, #0B2E1A 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0F3D24 0%, #176E30 35%, #1F8A3D 70%, #0B2E1A 100%);
      z-index: 9999;
    }
    
    #loading-screen.loaded {
      animation: fadeOut 0.38s ease-in-out forwards;
      pointer-events: none;
    }
    
    @keyframes fadeOut {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
    
    .splash-content {
      width: min(100% - 40px, 360px);
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: appear 0.7s cubic-bezier(0.2, 0.75, 0.25, 1) both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .logo-row {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 32px;
    }
    
    .logo-box {
      position: relative;
      width: 62px;
      height: 62px;
      background: linear-gradient(145deg, #ffffff, #eaf5ed);
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .loading-dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 12px;
    }

    .loading-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand-light);
      animation: dotPulse 1.1s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: 0.16s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.32s; }

    @keyframes dotPulse {
      0%, 60%, 100% { opacity: 0.4; transform: translateY(0); }
      30% { opacity: 1; transform: translateY(-4px); }
    }
    
    .logo-box svg {
      width: 32px;
      height: 32px;
      fill: var(--brand-green);
    }
    
    .text-container {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    
    .title-text {
      font-size: 17px;
      font-weight: 700;
      color: white;
      letter-spacing: 1.2px;
      margin: 0;
    }
    
    .subtitle-text {
      font-size: 9px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 1.35px;
      margin-top: 7px;
      text-transform: uppercase;
    }

    .loading-caption {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }

    .loading-state {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.2px;
    }

    @media (max-width: 420px) {
      .logo-row { gap: 12px; }
      .logo-box { width: 56px; height: 56px; }
      .title-text { font-size: 15px; }
      .subtitle-text { font-size: 8px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>

</head>
<body>
  <div id="loading-screen">
    <div class="splash-content">
      <div class="logo-row">
        <div class="logo-box">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 8h-3V4H3c-1.1 0-2 .9-2 2v11h2c0 1.66 1.34 3 3 3s3-1.34 3-3h6c0 1.66 1.34 3 3 3s3-1.34 3-3h2v-5l-3-4zM6 18.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm13.5-9l1.96 2.5H17V9.5h2.5zm-1.5 9c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
          </svg>
        </div>
        <div class="text-container">
          <div class="title-text">CPSU MOTORPOOL</div>
          <div class="subtitle-text">VEHICLE TRACKING SYSTEM</div>
        </div>
      </div>
      <div class="loading-dots" role="progressbar" aria-label="Loading CPSU MotorPool">
        <span></span><span></span><span></span>
      </div>
      <div class="loading-caption">
        <span class="loading-state">Preparing your workspace</span>
      </div>
    </div>
  </div>
  
  <script>
    window.addEventListener('flutter-first-frame', function() {
      const loadingScreen = document.getElementById('loading-screen');
      if (loadingScreen) {
        loadingScreen.classList.add('loaded');
        setTimeout(() => loadingScreen.remove(), 300);
      }
    });
  </script>
  
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
